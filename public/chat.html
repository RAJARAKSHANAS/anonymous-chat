<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Private Space</title>

    <link rel="stylesheet" href="chat.css">
</head>

<body>

    <div class="background-glow"></div>

    <main class="chat-container">

        <!-- PRIVATE ROOM ID SCREEN -->
        <section id="roomSelection" class="room-selection">

            <div class="room-icon">
                ✦
            </div>

            <h1>Enter Private Room</h1>

            <p>
                Enter your permanent private room ID
                to continue.
            </p>

            <input
                id="roomIdInput"
                type="text"
                placeholder="Enter Private Room ID"
                autocomplete="off"
            >

            <button
                id="joinRoomButton"
                class="room-button"
            >
                Enter Private Room →
            </button>

            <p
                id="roomMessage"
                class="room-message"
            ></p>

        </section>


        <!-- CHAT SCREEN -->
        <section
            id="chatSection"
            class="chat-section hidden"
        >

            <header class="chat-header">

                <div class="brand">

                    <div class="brand-icon">
                        ✦
                    </div>

                    <div>

                        <h1>Private Space</h1>

                        <p>
                            A quiet conversation for two
                        </p>

                    </div>

                </div>


                <div class="connection-status">

                    <span class="status-dot"></span>

                    <span id="statusText">
                        Connecting...
                    </span>

                </div>

            </header>


            <div class="private-room-label">

                🔒 Private Room

            </div>


            <!-- MESSAGES -->
            <section
                id="messages"
                class="messages"
            >

                <div class="welcome-message">

                    <div class="welcome-icon">
                        ✦
                    </div>

                    <h2>
                        Your private conversation
                    </h2>

                    <p>
                        You are now inside your
                        private room.
                    </p>

                </div>

            </section>


            <!-- MESSAGE INPUT -->
            <form
                id="messageForm"
                class="message-form"
            >

                <input
                    id="messageInput"
                    type="text"
                    placeholder="Write something..."
                    autocomplete="off"
                >

                <button type="submit">
                    →
                </button>

            </form>

        </section>

    </main>


    <!-- SOCKET.IO -->
    <script src="/socket.io/socket.io.js"></script>

    <!-- YOUR CHAT JAVASCRIPT -->
    <script src="chat.js"></script>

</body>

</html>
